 a.foto_perfil AS autor_foto FROM comentarios c JOIN artistas a ON c.usuario_id = a.id WHERE c.obra_id = ? ORDER BY c.created_at ASC\";\n    db.query(sql, [obraId], (err, rows) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        res.json({ success: true, comentarios: rows });\n    });\n};\n\nconst createComentario = (req, res) => {\n    const obraId = parseInt(req.params.id);\n    const usuarioId = req.user.id;\n    const { texto } = req.body;\n    db.query(\"INSERT INTO comentarios (obra_id, usuario_id, texto) VALUES (?, ?, ?)\", [obraId, usuarioId, texto], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        db.query(\"INSERT INTO reacciones (obra_id, usuario_id, tipo) VALUES (?, ?, 'comment') ON DUPLICATE KEY UPDATE id=id\", [obraId, usuarioId], (err2) => { if (err2) logger.warn(\"Error al registrar reaccion comment:\", err2.message); });\n        db.query(\"SELECT titulo, artista_user_id FROM obras WHERE id = ?\", [obraId], (err3, obras) => {\n            if (!err3 && obras.length > 0) {\n                const obra = obras[0];\n                if (obra.artista_user_id !== usuarioId) {\n                    const actorName = req.user.nombre_artista || \"Alguien\";\n                    db.query(\"INSERT INTO notificaciones (usuario_id, tipo, mensaje, obra_id, actor_id) VALUES (?, 'comment', ?, ?, ?)\", [obra.artista_user_id, actorName + ' comento tu cavent \"' + (obra.titulo || 'Sin titulo') + '\"', obraId, usuarioId]);\n                }\n            }\n        });\n        db.query(\"SELECT c.id, c.texto, c.created_at, a.nombre_artista AS autor_nombre, a.foto_perfil AS autor_foto FROM comentarios c JOIN artistas a ON c.usuario_id = a.id WHERE c.id = ?\", [result.insertId], (err4, rows) => {\n            if (err4) return res.status(500).json({ success: false, error: err4.message });\n            res.status(201).json({ success: true, comentario: rows[0] });\n        });\n    });\n};\nJSEND\necho \"3) controller functions added\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && python -c \"\nimport re\n\nwith open('controllers/obraController.js', 'r') as f:\n    content = f.read()\n\n# Replace getComentarios\nold_get = '''const getComentarios = (req, res) => {\n    const obraId = parseInt(req.params.id);\n    const sql = \\\"SELECT c.id, c.texto, c.created_at, a.nombre_artista AS autor_nombre, a.foto_perfil AS autor_foto FROM comentarios c JOIN artistas a ON c.usuario_id = a.id WHERE c.obra_id = ? ORDER BY c.created_at ASC\\\";\n    db.query(sql, [obraId], (err, rows) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        res.json({ success: true, comentarios: rows });\n    });\n};'''\n\nnew_get = '''const getComentarios = (req, res) => {\n    const obraId = parseInt(req.params.id);\n    const sql = \\\"SELECT c.id, c.texto, c.created_at, c.comentario_padre_id, a.nombre_artista AS autor_nombre, a.foto_perfil AS autor_foto, (SELECT COUNT(*) FROM comentario_likes WHERE comentario_id = c.id) AS likes_count FROM comentarios c JOIN artistas a ON c.usuario_id = a.id WHERE c.obra_id = ? ORDER BY c.created_at ASC\\\";\n    db.query(sql, [obraId], (err, rows) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        res.json({ success: true, comentarios: rows });\n    });\n};'''\n\ncontent = content.replace(old_get, new_get)\n\n# Replace createComentario\nold_create = '''const createComentario = (req, res) => {\n    const obraId = parseInt(req.params.id);\n    const usuarioId = req.user.id;\n    const { texto } = req.body;\n    db.query(\\\"INSERT INTO comentarios (obra_id, usuario_id, texto) VALUES (?, ?, ?)\\\", [obraId, usuarioId, texto], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        db.query(\\\"INSERT INTO reacciones (obra_id, usuario_id, tipo) VALUES (?, ?, 'comment') ON DUPLICATE KEY UPDATE id=id\\\", [obraId, usuarioId], (err2) => { if (err2) logger.warn(\\\"Error al registrar reaccion comment:\\\", err2.message); });\n        db.query(\\\"SELECT titulo, artista_user_id FROM obras WHERE id = ?\\\", [obraId], (err3, obras) => {\n            if (!err3 && obras.length > 0) {\n                const obra = obras[0];\n                if (obra.artista_user_id !== usuarioId) {\n                    const actorName = req.user.nombre_artista || \\\"Alguien\\\";\n                    db.query(\\\"INSERT INTO notificaciones (usuario_id, tipo, mensaje, obra_id, actor_id) VALUES (?, 'comment', ?, ?, ?)\\\", [obra.artista_user_id, actorName + ' comento tu cavent \\\"' + (obra.titulo || 'Sin titulo') + '\\\"', obraId, usuarioId]);\n                }\n            }\n        });\n        db.query(\\\"SELECT c.id, c.texto, c.created_at, a.nombre_artista AS autor_nombre, a.foto_perfil AS autor_foto FROM comentarios c JOIN artistas a ON c.usuario_id = a.id WHERE c.id = ?\\\", [result.insertId], (err4, rows) => {\n            if (err4) return res.status(500).json({ success: false, error: err4.message });\n            res.status(201).json({ success: true, comentario: rows[0] });\n        });\n    });\n};'''\n\nnew_create = '''const createComentario = (req, res) => {\n    const obraId = parseInt(req.params.id);\n    const usuarioId = req.user.id;\n    const { texto, comentario_padre_id } = req.body;\n    const parentId = comentario_padre_id ? parseInt(comentario_padre_id) : null;\n    db.query(\\\"INSERT INTO comentarios (obra_id, usuario_id, texto, comentario_padre_id) VALUES (?, ?, ?, ?)\\\", [obraId, usuarioId, texto, parentId], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        db.query(\\\"INSERT INTO reacciones (obra_id, usuario_id, tipo) VALUES (?, ?, 'comment') ON DUPLICATE KEY UPDATE id=id\\\", [obraId, usuarioId], (err2) => { if (err2) logger.warn(\\\"Error al registrar reaccion comment:\\\", err2.message); });\n        db.query(\\\"SELECT titulo, artista_user_id FROM obras WHERE id = ?\\\", [obraId], (err3, obras) => {\n            if (!err3 && obras.length > 0) {\n                const obra = obras[0];\n                if (obra.artista_user_id !== usuarioId) {\n                    const actorName = req.user.nombre_artista || \\\"Alguien\\\";\n                    db.query(\\\"INSERT INTO notificaciones (usuario_id, tipo, mensaje, obra_id, actor_id) VALUES (?, 'comment', ?, ?, ?)\\\", [obra.artista_user_id, actorName + ' comento tu cavent \\\"' + (obra.titulo || 'Sin titulo') + '\\\"', obraId, usuarioId]);\n                }\n            }\n        });\n        db.query(\\\"SELECT c.id, c.texto, c.created_at, c.comentario_padre_id, a.nombre_artista AS autor_nombre, a.foto_perfil AS autor_foto FROM comentarios c JOIN artistas a ON c.usuario_id = a.id WHERE c.id = ?\\\", [result.insertId], (err4, rows) => {\n            if (err4) return res.status(500).json({ success: false, error: err4.message });\n            res.status(201).json({ success: true, comentario: rows[0] });\n        });\n    });\n};'''\n\ncontent = content.replace(old_create, new_create)\n\n# Save\nwith open('controllers/obraController.js', 'w') as f:\n    f.write(content)\n\nprint('controller updated')\n\" && node -c controllers/obraController.js", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && python -c \"\nwith open('controllers/obraController.js', 'r') as f:\n    content = f.read()\n\nlike_handler = '''\n\nconst likeComentario = (req, res) => {\n    const commentId = parseInt(req.params.commentId);\n    const usuarioId = req.user.id;\n    db.query(\\\"SELECT id FROM comentario_likes WHERE comentario_id = ? AND usuario_id = ?\\\", [commentId, usuarioId], (err, rows) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        if (rows.length > 0) {\n            db.query(\\\"DE