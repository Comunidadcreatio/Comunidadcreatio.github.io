elId || 'default' } };\n    if (payload.tag) android.notification.tag = payload.tag;\n    if (payload.notificationCount) android.notification.notificationCount = payload.notificationCount;\n    if (payload.image) {\n        android.notification.image = payload.image;\n        android.notification.style = 'bigpicture';\n    }\n    const message = {\n        token: deviceToken,\n        notification: { title: payload.title || '', body: payload.body || '' },\n        android,\n        data: {}\n    };\n    if (payload.image) message.notification.image = payload.image;\n    (payload.data || {}).forEachKey ? null : null;\n    Object.keys(payload.data || {}).forEach(k => {\n        const v = payload.data[k];\n        message.data[k] = (v === null || v === undefined) ? '' : String(v);\n    });\n    return message;\n}\n\n// Envía un push a un token de dispositivo concreto.\nasync function sendFcm(deviceToken, payload) {\n    if (!habilitado) { avisarDesactivado(); return false; }\n    const access = await getAccessToken();\n    if (!access) return false;\n    const resp = await fetch(`https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send`, {\n        method: 'POST',\n        headers: {\n            'Authorization': `Bearer ${access}`,\n            'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({ message: construirMensaje(deviceToken, payload) })\n    });\"\"\"\n\nassert c.count(old) == 1, 'sendFcm no encontrado'\nc = c.replace(old, new)\nopen(p, 'w', encoding='utf-8').write(c)\nprint('sendFcm enriquecido')\nPYEOF\nnode -c services/firebase-push.js && echo \"OK\" && sed -n '78,100p' services/firebase-push.js", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && python - << 'PYEOF'\np = 'services/firebase-push.js'\nc = open(p, 'r', encoding='utf-8').read()\nc = c.replace(\"    (payload.data || {}).forEachKey ? null : null;\\n\", \"\")\nc = c.replace(\"\"\"    if (payload.image) {\n        android.notification.