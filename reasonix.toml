ación\n                db.query('SELECT nombre_artista, foto_perfil FROM artistas WHERE id = ?', [req.user.id], (errA, autorRows) => {\n                    if (errA || !autorRows || !autorRows.length) return;\n                    const autor = autorRows[0];\n                    // Incrementa el contador de no leídos del receptor en este canal\n                    db.query('INSERT INTO chat_contadores (usuario_id, canal, n) VALUES (?, ?, 1) ON DUPLICATE KEY UPDATE n = n + 1', [otro, canal], (errC) => {\n                        if (errC) return;\n                        db.query('SELECT n, TIMESTAMPDIFF(SECOND, updated_at, NOW()) AS seg FROM chat_contadores WHERE usuario_id = ? AND canal = ?', [otro, canal], (errS, cnt) => {\n                            if (errS || !cnt || !cnt.length) return;\n                            const n = cnt[0].n;\n                            // Si el receptor está viendo esta sala ahora (marcó leído\n                            // hace <45s), el polling se lo entregará: no notificar.\n                            if (cnt[0].seg <= 45) return;\n                            enviarAUsuario(otro, {\n                                title: autor.nombre_artista || 'Nuevo mensaje',\n                                body: n > 1 ? `${n} mensajes nuevos` : contenido.slice(0, 120),\n                                image: autor.foto_perfil || null,\n                                data: {\n                                    tipo: 'chat',\n                                    canal,\n                                    otro_nombre: autor.nombre_artista || '',\n                                    n: String(n),\n                                    foto: autor.foto_perfil || '',\n                                    ultimo: contenido.slice(0, 200)\n                                },\n                                tag: canal,\n                                notificationCount: n\n                            });\n                        });\n                  