old_create = \"CREATE TABLE IF NOT EXISTS chat_mensajes (id BIGINT AUTO_INCREMENT PRIMARY KEY, tipo ENUM('global','priv') NOT NULL, canal VARCHAR(40) NOT NULL, autor_id INT NOT NULL, contenido VARCHAR(1000) NOT NULL, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, KEY idx_canal_id (canal, id), KEY idx_autor_id (autor_id, id))\"\nnew_create = \"CREATE TABLE IF NOT EXISTS chat_mensajes (id BIGINT AUTO_INCREMENT PRIMARY KEY, tipo ENUM('global','priv') NOT NULL, canal VARCHAR(40) NOT NULL, autor_id INT NOT NULL, contenido VARCHAR(1000) NOT NULL, oculto_para_menor TINYINT(1) DEFAULT 0, oculto_para_mayor TINYINT(1) DEFAULT 0, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, KEY idx_canal_id (canal, id), KEY idx_autor_id (autor_id, id))\"\nassert c.count(old_create) == 1, 'CREATE chat_mensajes no encontrado'\nc = c.replace(old_create, new_create)\nold_tail = '''        if (err) logger.error(\"No se pudo crear tabla chat_mensajes:\", err.message);\n        else logger.info(\"Tabla chat_mensajes verificada\");\n    });\n}'''\nnew_tail = '''        if (err) logger.error(\"No se pudo crear tabla chat_mensajes:\", err.message);\n        else logger.info(\"Tabla chat_mensajes verificada\");\n    });\n    db.query(\"ALTER TABLE chat_mensajes ADD COLUMN IF NOT EXISTS oculto_para_menor TINYINT(1) DEFAULT 0, ADD COLUMN IF NOT EXISTS oculto_para_mayor TINYINT(1) DEFAULT 0\", (err) => {\n        if (err) logger.error(\"No se pudieron agregar columnas oculto_para_* a chat_mensajes:\", err.message);\n        else logger.info(\"Columnas oculto_para_* verificadas en chat_mensajes\");\n    });\n}'''\nassert c.count(old_tail) == 1, 'cierre runMigrations no encontrado'\nc = c.replace(old_tail, new_tail)\nopen(p, 'w', encoding='utf-8').write(c)\nprint('config/db.js actualizado')\nPYEOF\nnode -c config/db.js && echo \"db.js OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && python - << 'PYEOF'\np = 'controllers/chatController.js'\nc = open(p, 'r', encoding='utf-8').read()\n\n# --- getMensajes: filtrar mensajes ocultos para el solicitante ---\nold = '''const getMensajes = (req, res) => {\n    const canal = String(req.query.canal || '');\n    const afterId = parseInt(req.query.afterId, 10) || 0;\n    if (!canalValido(canal, req.user.id)) {\n        return res.status(400).json({ success: false, error: 'Canal inválido' });\n    }\n    const base = \"SELECT m.id, m.canal, m.autor_id, m.contenido, m.created_at, a.nombre_artista, a.foto_perfil FROM chat_mensajes m JOIN artistas a ON a.id = m.autor_id WHERE m.canal = ?\";'''\nnew = '''const getMensajes = (req, res) => {\n    const canal = String(req.query.canal || '');\n    const afterId = parseInt(req.query.afterId, 10) || 0;\n    if (!canalValido(canal, req.user.id)) {\n        return res.status(400).json({ success: false, error: 'Canal inválido' });\n    }\n    // En chats privados, ocultar los mensajes que este usuario marcó como borrados\n    let hideSql = '';\n    if (canal !== 'global') {\n        const nums = canal.replace('priv:', '').split(':').map(Number);\n        const lado = req.user.id === nums[0] ? 'oculto_para_menor' : 'oculto_para_mayor';\n        hideSql = ` AND m.${lado} = 0`;\n    }\n    const base = \"SELECT m.id, m.canal, m.autor_id, m.contenido, m.created_at, a.nombre_artista, a.foto_perfil FROM chat_mensajes m JOIN artistas a ON a.id = m.autor_id WHERE m.canal = ?\" + hideSql;'''\nassert c.count(old) == 1, 'getMensajes no encontrado'\nc = c.replace(old, new)\n\n# --- getConversaciones: solo canales con mensajes no ocultos para el usuario ---\nold2 = '''    const p1 = `priv:${me}:%`;\n    const p2 = `priv:%:${me}`;\n    const sql = \"SELECT canal, MAX(id) AS last_id, MAX(created_at) AS last_at FROM chat_mensajes WHERE tipo = 'priv' AND (canal LIKE ? OR canal LIKE ?) GROUP BY canal ORDER BY last_at DESC LIMIT 20\";'''\nnew2 = '''    const p1 = `priv:${me}:%`; // en estos canales yo soy el menor\n    const p2 = `priv:%:${me}`; // en estos canales yo soy el mayor\n    const sql = \"SELECT canal, MAX(id) AS last_id, MAX(created_at) AS last_at FROM chat_mensajes WHERE tipo = 'priv' AND ((canal LIKE ? AND oculto_para_menor = 0) OR (canal LIKE ? AND oculto_para_mayor = 0)) GROUP BY canal ORDER BY last_at DESC LIMIT 20\";'''\nassert c.count(old2) == 1, 'getConversaciones no encontrado'\nc = c.replace(old2, new2)\n\n# --- eliminarConversacion: marcar oculto para el solicitante (no DELETE físico) ---\nold3 = '''// DELETE /chat/conversaciones — borra todos los mensajes de un chat privado.\n// Solo el propio participante puede eliminar su conversación.\nconst eliminarConversacion = (req, res) => {\n    const canal = String(req.body.canal || '');\n    if (!canalPrivadoValido(canal, req.user.id)) {\n        return res.status(400).json({ success: false, error: 'Canal inválido' });\n    }\n    const sql = \"DELETE FROM chat_mensajes WHERE canal = ?\";\n    db.query(sql, [canal], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        res.json({ success: true, eliminados: result.affectedRows || 0 });\n    });\n};'''\nnew3 = '''// DELETE /chat/conversaciones — oculta la conversación SOLO para quien la borra.\n// El otro participante conserva sus mensajes hasta que decida borrarlos.\nconst eliminarConversacion = (req, res) => {\n    const canal = String(req.body.canal || '');\n    if (!canalPrivadoValido(canal, req.user.id)) {\n        return res.status(400).json({ success: false, error: 'Canal inválido' });\n    }\n    const nums = canal.replace('priv:', '').split(':').map(Number);\n    const col = req.user.id === nums[0] ? 'oculto_para_menor' : 'oculto_para_mayor';\n    const sql = `UPDATE chat_mensajes SET ${col} = 1 WHERE canal = ? AND tipo = 'priv' AND ${col} = 0`;\n    db.query(sql, [canal], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        res.json({ success: true, ocultados: result.affectedRows || 0 });\n    });\n};'''\nassert c.count(old3) == 1, 'eliminarConversacion no encontrado'\nc = c.replace(old3, new3)\n\nopen(p, 'w', encoding='utf-8').write(c)\nprint('chatController.js actualizado (ocultado por usuario)')\nPYEOF\nnode -c controllers/chatController.js && echo \"controller OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && git add config/db.js controllers/chatController.js && git commit -m \"feat(chat): borrado por usuario — oculto_para_menor/mayor; eliminar conversación solo la oculta para quien borra, el otro la conserva\" && git push origin main", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && node scripts/bump-version.js 2>&1 | grep -E \"versión\" | head -2 && git add -A && git commit -m \"feat(chat): degradado a ancho completo (borde izquierdo a derecho) fijo, la fila de círculos solo se alinea a la derecha sin estirar el degradado — bump v1.0.306\" && git push origin main && sleep 30 && curl -s \"https://comunidadcreatio.vercel.app/version.json?t=$(date +%s)\" && echo && curl -s \"https://comunidadcreatio.vercel.app/css/chat.css\" | grep -A4 \"^\\.chat-cluster {\" | head -6 && sleep 3 && curl -s -o /dev/null -w \"backend /chat/directorio → HTTP %{http_code}\\n\" \"https://backend-fundacion-atpe.onrender.com/chat/directorio\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && node scripts/bump-version.js 2>&1 | grep -E \"versión\" | head -2 && git add -A && git commit -m \"fix(chat): icono de enviar visible en modo oscuro (gris medio #525252 con icono claro) — bump v1.0.307\" && git push origin main && sleep 25 && curl -s \"https://comunidadcreatio.vercel.app/version.json?t=$(date +%s)\" && echo && curl -s \"https://comunidadcreatio.vercel.app/css/chat.css\" | grep -c \"chat-enviar-btn\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && python - << 'PYEOF'\n# 1) Migración: tabla device_tokens en config/db.js\np = 'config/db.js'\nc = open(p, 'r', encoding='utf-8').read()\nanchor = '''    db.query(\"ALTER TABLE chat_mensajes ADD COLUMN IF NOT EXISTS oculto_para_menor TINYINT(1) DEFAULT 0, ADD COLUMN IF NOT EXISTS oculto_para_mayor TINYINT(1) DEFAULT 0\", (err) => {\n        if (err) logger.error(\"No se pudieron agregar columnas oculto_para_* a chat_mensajes:\", err.message);\n        else logger.info(\"Columnas oculto_para_* verificadas en chat_mensajes\");\n    });\n}'''\nnuevo = '''    db.query(\"ALTER TABLE chat_mensajes ADD COLUMN IF NOT EXISTS oculto_para_menor TINYINT(1) DEFAULT 0, ADD COLUMN IF NOT EXISTS oculto_para_mayor TINYINT(1) DEFAULT 0\", (err) => {\n        if (err) logger.error(\"No se pudieron agregar columnas oculto_para_* a chat_mensajes:\", err.message);\n        else logger.info(\"Columnas oculto_para_* verificadas en chat_mensajes\");\n    });\n    db.query(\"CREATE TABLE IF NOT EXISTS device_tokens (id INT AUTO_INCREMENT PRIMARY KEY, usuario_id INT NOT NULL, token VARCHAR(255) NOT NULL, plataforma VARCHAR(20) DEFAULT 'android', created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP, updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP, UNIQUE KEY uq_token (token))\", (err) => {\n        if (err) logger.error(\"No se pudo crear tabla device_tokens:\", err.message);\n        else logger.info(\"Tabla device_tokens verificada\");\n    });\n}'''\nassert anchor in c, 'ancla runMigrations no encontrada'\nopen(p, 'w', encoding='utf-8').write(c.replace(anchor, nuevo))\nprint('config/db.js: device_tokens OK')\nPYEOF\nnode -c config/db.js && echo \"db.js OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && cat > services/firebase-push.js << 'EOF'\n// services/firebase-push.js\n// Envío de push notifications con Firebase Cloud Messaging (FCM API v1).\n// Usa una cuenta de servicio de Firebase (sin dependencias extra: jsonwebtoken\n// ya está en el proyecto para firmar el JWT de autenticación OAuth2).\n//\n// Configuración (variables de entorno en Render):\n//   FIREBASE_PROJECT_ID     → id del proyecto Firebase (project_id del JSON)\n//   FIREBASE_CLIENT_EMAIL   → client_email del JSON de la cuenta de servicio\n//   FIREBASE_PRIVATE_KEY    → private_key del JSON (con los saltos de línea reales)\n//\n// Si faltan las variables, el módulo queda desactivado y no rompe nada.\nconst jwt = require('jsonwebtoken');\nconst { db } = require('../config/db');\nconst logger = require('../logger');\n\nconst PROJECT_ID = process.env.FIREBASE_PROJECT_ID || '';\nconst CLIENT_EMAIL = process.env.FIREBASE_CLIENT_EMAIL || '';\nconst PRIVATE_KEY = process.env.FIREBASE_PRIVATE_KEY || '';\n\nconst habilitado = !!(PROJECT_ID && CLIENT_EMAIL && PRIVATE_KEY);\nlet avisoEnviado = false;\n\nlet accessToken = null;\nlet accessTokenExp = 0;\n\nfunction avisarDesactivado() {\n    if (!avisoEnviado) {\n        logger.warn('🔕 FCM desactivado: faltan FIREBASE_PROJECT_ID / FIREBASE_CLIENT_EMAIL / FIREBASE_PRIVATE_KEY');\n        avisoEnviado = true;\n    }\n}\n\n// Obtiene (y cachea ~50 min) un access token de Google con el JWT firmado.\nasync function getAccessToken() {\n    if (accessToken && Date.now() < accessTokenExp) return accessToken;\n    const now = Math.floor(Date.now() / 1000);\n    const claims = {\n        iss: CLIENT_EMAIL,\n        scope: 'https://www.googleapis.com/auth/firebase.messaging',\n        aud: 'https://oauth2.googleapis.com/token',\n        iat: now,\n        exp: now + 3600\n    };\n    const signed = jwt.sign(claims, PRIVATE_KEY, { algorithm: 'RS256' });\n    const body = `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${encodeURIComponent(signed)}`;\n    const resp = await fetch('https://oauth2.googleapis.com/token', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },\n        body\n    });\n    if (!resp.ok) {\n        logger.error('FCM: no se pudo obtener access token', resp.status, await resp.text());\n        return null;\n    }\n    const data = await resp.json();\n    accessToken = data.access_token;\n    accessTokenExp = Date.now() + (data.expires_in || 3600) * 1000 - 60 * 1000;\n    return accessToken;\n}\n\n// Envía un push a un token de dispositivo concreto.\nasync function sendFcm(deviceToken, payload) {\n    if (!habilitado) { avisarDesactivado(); return false; }\n    const access = await getAccessToken();\n    if (!access) return false;\n    const resp = await fetch(`https://fcm.googleapis.com/v1/projects/${PROJECT_ID}/messages:send`, {\n        method: 'POST',\n        headers: {\n            'Authorization': `Bearer ${access}`,\n            'Content-Type': 'application/json'\n        },\n        body: JSON.stringify({\n            message: {\n                token: deviceToken,\n                notification: { title: payload.title, body: payload.body },\n                data: payload.data || {}\n            }\n        })\n    });\n    if (!resp.ok) {\n        logger.error('FCM: envío fallido', resp.status, (await resp.text()).slice(0, 300));\n        return false;\n    }\n    return true;\n}\n\n// Envía push a TODOS los dispositivos de un usuario (usa la tabla device_tokens).\nasync function enviarAUsuario(usuarioId, payload) {\n    if (!habilitado || !usuarioId) return;\n    db.query('SELECT token FROM device_tokens WHERE usuario_id = ?', [usuarioId], async (err, rows) => {\n        if (err || !rows || !rows.length) return;\n        for (const r of rows) {\n            try { await sendFcm(r.token, payload); } catch (e) { logger.error('FCM push:', e.message); }\n        }\n    });\n}\n\nmodule.exports = { enviarAUsuario, habilitado };\nEOF\nnode -c services/firebase-push.js && echo \"firebase-push.js OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && cat > routes/pushRoutes.js << 'EOF'\n// routes/pushRoutes.js — registro de tokens FCM por dispositivo\nconst express = require('express');\nconst router = express.Router();\nconst { authenticateToken } = require('../middleware/auth');\nconst { db } = require('../config/db');\n\nrouter.use(authenticateToken);\n\n// POST /api/push/registrar-token — la app guarda su token FCM tras el login\nrouter.post('/registrar-token', (req, res) => {\n    const token = String(req.body.token || '').trim();\n    const plataforma = String(req.body.plataforma || 'android').slice(0, 20);\n    if (!token || token.length < 10 || token.length > 255) {\n        return res.status(400).json({ success: false, error: 'Token inválido' });\n    }\n    const sql = \"INSERT INTO device_tokens (usuario_id, token, plataforma) VALUES (?, ?, ?) ON DUPLICATE KEY UPDATE usuario_id = VALUES(usuario_id), plataforma = VALUES(plataforma)\";\n    db.query(sql, [req.user.id, token, plataforma], (err) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        res.json({ success: true });\n    });\n});\n\n// DELETE /api/push/registrar-token — al cerrar sesión se desvincula el token\nrouter.delete('/registrar-token', (req, res) => {\n    const token = String(req.body.token || '').trim();\n    if (!token) return res.status(400).json({ success: false, error: 'Token inválido' });\n    db.query(\"DELETE FROM device_tokens WHERE token = ? AND usuario_id = ?\", [token, req.user.id], (err) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        res.json({ success: true });\n    });\n});\n\nmodule.exports = router;\nEOF\nnode -c routes/pushRoutes.js && echo \"pushRoutes.js OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && python - << 'PYEOF'\n# 1) app.js: rutas push\np = 'app.js'\nc = open(p, 'r', encoding='utf-8').read()\nif 'pushRoutes' not in c:\n    c = c.replace(\n        'const chatRoutes = require(\"./routes/chatRoutes\");',\n        'const chatRoutes = require(\"./routes/chatRoutes\");\\nconst pushRoutes = require(\"./routes/pushRoutes\");'\n    )\n    c = c.replace(\n        'app.use(\"/chat\", chatRoutes);',\n        'app.use(\"/chat\", chatRoutes);\\napp.use(\"/api/push\", pushRoutes);'\n    )\n    open(p, 'w', encoding='utf-8').write(c)\n    print('app.js OK')\nelse:\n    print('app.js ya tenía pushRoutes')\n\n# 2) chatController.enviarMensaje: push al otro participante\np2 = 'controllers/chatController.js'\nc2 = open(p2, 'r', encoding='utf-8').read()\nold = '''    db.query(sql, [tipo, canal, req.user.id, contenido], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        // El autor es el usuario logueado: el cliente ya tiene su propia foto/nombre.\n        res.json({'''\nnew = '''    db.query(sql, [tipo, canal, req.user.id, contenido], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        // Push al otro participante (solo chats privados)\n        if (tipo === 'priv') {\n            try {\n                const { enviarAUsuario } = require('../services/firebase-push');\n                const nums = canal.replace('priv:', '').split(':').map(Number);\n                const otro = nums.find(n => n !== req.user.id);\n                if (otro) {\n                    enviarAUsuario(otro, {\n                        title: `${req.user.nombre_artista || 'Alguien'} te envió un mensaje`,\n                        body: contenido.slice(0, 120),\n                        data: { tipo: 'chat', canal }\n                    });\n                }\n            } catch (e) { /* el push nunca debe romper el envío */ }\n        }\n        // El autor es el usuario logueado: el cliente ya tiene su propia foto/nombre.\n        res.json({'''\nassert c2.count(old) == 1, 'enviarMensaje no encontrado'\nopen(p2, 'w', encoding='utf-8').write(c2.replace(old, new))\nprint('chatController.js: push en mensaje privado OK')\nPYEOF\nnode -c app.js && node -c controllers/chatController.js && echo \"sintaxis OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadePro