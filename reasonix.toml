iews_count:', d[0].get('views_count'))\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && node scripts/bump-version.js 2>&1 | grep -E \"✓|versión|sin cambios\" | head -12 && echo \"===version===\" && cat version.json", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && node --check scripts/bump-version.js && echo \"syntax OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && node scripts/bump-version.js 2>&1 | tail -6", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && node -e \"const c=require('fs').readFileSync('js/main.js','utf-8');const h=require('crypto').createHash('md5').update(c).digest('hex').slice(0,10);console.log('hash real main.js:', h);console.log('coincide con index.html:', h==='51059b4a74')\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && git add -A && git commit -m \"fix: cola del popover de vistas con borde gris igual al popover (::before borde + ::after relleno), bump v1.0.284\" && git push origin main 2>&1 | tail -3", "Bash=sleep 20 && curl -s \"https://comunidadcreatio.vercel.app/version.json?t=$(date +%s)\" && echo && curl -s \"https://comunidadcreatio.vercel.app/css/galeria-publica.css\" | grep -A3 \"vistas-popover::before\" | head -8", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && sed -n '88,125p' index.html", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && sed -n '57,80p' controllers/authController.js", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && sed -n '1,45p' index.js && echo \"===middlewares===\" && grep -rn \"verificarSesionActiva\\|authenticateToken\" middleware/*.js 2>/dev/null | head -5; ls middleware 2>/dev/null || grep -rn \"const verificarSesionActiva\\|function verificarSesionActiva\\|exports.verificarSesionActiva\" *.js routes/*.js | head", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && sed -n '28,80p' js/galeria-ui.js && echo \"===artistaActual===\" && grep -n \"artistaActual\" js/auth.js | head -8", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\fundacionextramuros.github.io\" && sed -n '10,40p' js/auth.js && echo \"===btn-cavents-hub wiring===\" && grep -n \"btn-cavents-hub\\|cavents-popover\\|toggleExplorar\" js/main.js | head -10", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && cat > controllers/chatController.js << 'EOF'\n// controllers/chatController.js\n// Chat global + privado. Diseño económico: sin websockets, el cliente hace\n// polling condicional (solo con el chat abierto) usando id > afterId.\nconst { db } = require('../config/db');\n\n// Canal privado: 'priv:<idMenor>:<idMayor>' (IDs ordenados para que ambos\n// usuarios consulten la misma fila).\nfunction canalPrivadoValido(canal, usuarioId) {\n    const m = /^priv:(\\d+):(\\d+)$/.exec(canal);\n    if (!m) return false;\n    const a = parseInt(m[1], 10);\n    const b = parseInt(m[2], 10);\n    if (a <= 0 || b <= 0 || a === b || a > b) return false;\n    return a === usuarioId || b === usuarioId;\n}\n\nfunction canalValido(canal, usuarioId) {\n    if (canal === 'global') return true;\n    return canalPrivadoValido(canal, usuarioId);\n}\n\n// GET /chat/directorio — usuarios registrados agrupados por su ciudad.\nconst getDirectorio = (req, res) => {\n    const sql = \"SELECT ciudad, id, nombre_artista, foto_perfil FROM artistas WHERE verificado = true AND ciudad IS NOT NULL AND ciudad != '' ORDER BY ciudad, nombre_artista\";\n    db.query(sql, (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        const porPueblo = {};\n        for (const u of result) {\n            if (!porPueblo[u.ciudad]) porPueblo[u.ciudad] = [];\n            porPueblo[u.ciudad].push({\n                id: u.id,\n                nombre_artista: u.nombre_artista,\n                foto_perfil: u.foto_perfil\n            });\n        }\n        res.json({ success: true, pueblos: porPueblo });\n    });\n};\n\n// GET /chat/mensajes?canal=global|priv:a:b&afterId=N\nconst getMensajes = (req, res) => {\n    const canal = String(req.query.canal || '');\n    const afterId = parseInt(req.query.afterId, 10) || 0;\n    if (!canalValido(canal, req.user.id)) {\n        return res.status(400).json({ success: false, error: 'Canal inválido' });\n    }\n    const base = \"SELECT m.id, m.canal, m.autor_id, m.contenido, m.created_at, a.nombre_artista, a.foto_perfil FROM chat_mensajes m JOIN artistas a ON a.id = m.autor_id WHERE m.canal = ?\";\n    if (afterId > 0) {\n        const sql = `${base} AND m.id > ? ORDER BY m.id ASC LIMIT 50`;\n        db.query(sql, [canal, afterId], (err, rows) => {\n            if (err) return res.status(500).json({ success: false, error: err.message });\n            res.json({ success: true, mensajes: rows });\n        });\n    } else {\n        const sql = `${base} ORDER BY m.id DESC LIMIT 30`;\n        db.query(sql, [canal], (err, rows) => {\n            if (err) return res.status(500).json({ success: false, error: err.message });\n            res.json({ success: true, mensajes: rows.reverse() });\n        });\n    }\n};\n\n// POST /chat/mensajes { canal, contenido }\nconst enviarMensaje = (req, res) => {\n    const canal = String(req.body.canal || '');\n    const contenido = String(req.body.contenido || '').trim();\n    if (!canalValido(canal, req.user.id)) {\n        return res.status(400).json({ success: false, error: 'Canal inválido' });\n    }\n    if (!contenido || contenido.length > 1000) {\n        return res.status(400).json({ success: false, error: 'Mensaje vacío o demasiado largo' });\n    }\n    const tipo = canal === 'global' ? 'global' : 'priv';\n    const sql = \"INSERT INTO chat_mensajes (tipo, canal, autor_id, contenido) VALUES (?, ?, ?, ?)\";\n    db.query(sql, [tipo, canal, req.user.id, contenido], (err, result) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        // El autor es el usuario logueado: el cliente ya tiene su propia foto/nombre.\n        res.json({\n            success: true,\n            mensaje: {\n                id: result.insertId,\n                canal,\n                autor_id: req.user.id,\n                contenido,\n                created_at: new Date(),\n                nombre_artista: req.user.nombre_artista || '',\n                foto_perfil: null\n            }\n        });\n    });\n};\n\n// GET /chat/conversaciones — últimos chats privados del usuario.\nconst getConversaciones = (req, res) => {\n    const me = req.user.id;\n    const p1 = `priv:${me}:%`;\n    const p2 = `priv:%:${me}`;\n    const sql = \"SELECT canal, MAX(id) AS last_id, MAX(created_at) AS last_at FROM chat_mensajes WHERE tipo = 'priv' AND (canal LIKE ? OR canal LIKE ?) GROUP BY canal ORDER BY last_at DESC LIMIT 20\";\n    db.query(sql, [p1, p2], (err, rows) => {\n        if (err) return res.status(500).json({ success: false, error: err.message });\n        if (rows.length === 0) return res.json({ success: true, conversaciones: [] });\n        const lastIds = rows.map(r => r.last_id);\n        const otros = new Set();\n        rows.forEach(r => {\n            r.canal.replace('priv:', '').split(':').map(Number).forEach(n => { if (n !== me) otros.add(n); });\n        });\n        const inIds = lastIds.map(() => '?').join(',');\n        const inUsers = Array.from(otros).map(() => '?').join(',');\n        db.query(`SELECT id, canal, autor_id, contenido, created_at FROM chat_mensajes WHERE id IN (${inIds})`, lastIds, (err2, msgs) => {\n            if (err2) return res.status(500).json({ success: false, error: err2.message });\n            const msgPorId = {};\n            msgs.forEach(m => { msgPorId[m.id] = m; });\n            db.query(`SELECT id, nombre_artista, foto_perfil FROM artistas WHERE id IN (${inUsers})`, Array.from(otros), (err3, users) => {\n                if (err3) return res.status(500).json({ success: false, error: err3.message });\n                const userPorId = {};\n                users.forEach(u => { userPorId[u.id] = u; });\n                const conversaciones = rows.map(r => {\n                    const m = msgPorId[r.last_id] || null;\n                    const nums = r.canal.replace('priv:', '').split(':').map(Number);\n                    const otroId = nums.find(n => n !== me);\n                    const u = userPorId[otroId] || {};\n                    return {\n                        canal: r.canal,\n                        otro_id: otroId,\n                        otro_nombre: u.nombre_artista || 'Usuario',\n                        otro_foto: u.foto_perfil || null,\n                        ultimo: m ? { id: m.id, autor_id: m.autor_id, contenido: m.contenido, created_at: m.created_at } : null\n                    };\n                });\n                res.json({ success: true, conversaciones });\n            });\n        });\n    });\n};\n\nmodule.exports = { getDirectorio, getMensajes, enviarMensaje, getConversaciones };\nEOF\nnode -c controllers/chatController.js && echo \"chatController OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && cat > routes/chatRoutes.js << 'EOF'\n// routes/chatRoutes.js\n// Chat global + privado. GET con solo authenticateToken (sin verificarSesionActiva:\n// esa middleware hace un UPDATE de sesión por request y el polling del chat\n// pegaría 5 veces/min por usuario). El POST sí mantiene el rate-limit.\nconst express = require('express');\nconst router = express.Router();\nconst rateLimit = require('express-rate-limit');\nconst { authenticateToken } = require('../middleware/auth');\nconst chatController = require('../controllers/chatController');\n\nconst chatLimiter = rateLimit({\n    windowMs: 60 * 1000, // 1 minuto\n    max: 30,\n    message: { success: false, error: '⚠️ Demasiados mensajes. Espera un momento.' },\n    standardHeaders: true,\n    legacyHeaders: false\n});\n\n// Todas las rutas de chat requieren sesión (JWT válido en cookie HttpOnly)\nrouter.use(authenticateToken);\n\nrouter.get('/directorio', chatController.getDirectorio);\nrouter.get('/mensajes', chatController.getMensajes);\nrouter.get('/conversaciones', chatController.getConversaciones);\nrouter.post('/mensajes', chatLimiter, chatController.enviarMensaje);\n\nmodule.exports = router;\nEOF\nnode -c routes/chatRoutes.js && echo \"chatRoutes OK\"", "Bash=cd \"C:\\Users\\Edgar PC\\CascadeProjects\\backend-fundacion-git\" && python - << 'PYEOF'\n# 1) app.js: registrar chatRoutes\np = 'app.js'\nc = open(p, 'r', encoding='utf-8').read()\nif \"chatRoutes\" not in c:\n    c = c.replace(\n        'const notificacionesRoutes = require(\"./routes/notificacionesRoutes\");',\n        'const notificacionesRoutes = require(\"./routes/notificacionesRoutes\");\\nconst chatRoutes = require(\"./routes/chatRoutes\");'\n    )\n    c = c.replace(\n        'app.use(\"/api/artistas/notificaciones\", notificacionesRoutes);',\n        'app.use(\"/api/artistas/notificaciones\", notificacionesRoutes);\\napp.use(\"/chat\", chatRoutes);'\n    )\n    open(p, 'w', encoding='utf-8').write(c)\n    print('app.js actualizado')\nelse:\n    print('app.js ya tenía chatRoutes')\n\n# 2) config/db.js: migración tabla chat_mensajes\np2 = 'config/db.js'\nc2 = open(p2, 'r', encoding='utf-8').read()\nif 'chat_mensajes' not in c2:\n    anchor = '''    db.query(\"CREATE TABLE IF NOT EXISTS notificaciones (id INT AUTO_INCREMENT PRIMARY KEY, usuario_id INT NOT NULL, tipo VARCHAR(10) NOT NULL, mensaje VARCHAR(500) NOT NULL, obra_id INT NULL, actor_id INT NULL, leida TINYINT(1) DEFAULT 0, created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP)\", (err) => {\n        if (err) logger.error(\"No se pudo crear tabla notificaciones:\", err.message);\n        else logger.info(\"Tabla notificaciones verificada\");\n    });\n}'''\